name: commit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  fast-build:
    runs-on: windows-latest

    steps:
    - name: checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: msvc
      uses: ilammy/msvc-dev-cmd@v1

    - name: ninja
      uses: llvm/actions/install-ninja@main

    - name: vulkan
      uses: jakoch/install-vulkan-sdk-action@v1
      with:
        version: '1.3.296.0'
        cache: true

    - name: cmake
      run: >
        cmake -B build
        -G "Ninja"
        -DCMAKE_BUILD_TYPE=Debug

    - name: build
      run: cmake --build build --config Debug --target FunkinPlusPlus
